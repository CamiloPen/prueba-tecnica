<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>tasks</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">tasks</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    @for (task of tasks; track task.id) {
      <ion-item>
        <ion-label>
          <h2>{{task.title}}</h2>
        </ion-label>
      </ion-item>
    }
  </ion-list>
  
</ion-content>
